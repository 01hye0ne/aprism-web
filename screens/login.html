<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — APRISM</title>
  <meta name="description" content="APRISM 공장 환경점검 로봇 관제 시스템 로그인" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css?v=e254913d" />
  <link rel="stylesheet" href="../assets/css/app-shell.css?v=4f5dac9a" />
  <link rel="stylesheet" href="../assets/css/auth.css?v=b98ac05d" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      background-color: var(--bg-canvas);
      color: var(--fg-primary);
      font-family: var(--font-family-sans);
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>

<!-- ============================================================
     UI_01 / CM-02 로그인 화면   (node 630:3481)
     좌: 브랜드 면 1120(58.33%) · 우: 캔버스 위에 뜬 로그인 카드 468
     ============================================================ -->
<div class="auth auth-login">

  <!-- ---------- Brand Panel (591:3456) ---------- -->
  <section class="auth-brand" aria-label="APRISM">
    <div class="brand-block">
      <span class="brand-lockup i" role="img" aria-label="APRISM"></span>

      <div class="brand-tagline">
        <p class="brand-title t-title-1">공장 환경점검 로봇 관제 시스템</p>
        <p class="brand-sub t-body-4">Autonomous Plant Inspection &amp; Robot Supervision</p>
      </div>
    </div>
  </section>

  <!-- ---------- Login Panel (591:3464) — 카드가 앉는 자리 ---------- -->
  <div class="auth-panel">

    <form class="login-card" data-login-form novalidate>

      <!-- Figma "Header" — Heading/2 + Body/3 -->
      <div class="login-head">
        <h1 class="t-heading-2">로그인</h1>
        <p class="t-body-3">등록된 계정으로 관제 시스템에 접속합니다.</p>
      </div>

      <!-- Figma "Fields" — Text Field / Medium 둘 + Options -->
      <div class="login-fields">

        <div class="field">
          <label class="field-label" for="login-id">아이디</label>
          <div class="field-box">
            <span class="i i-20 lead" style="--i:var(--ic-user)" aria-hidden="true"></span>
            <input type="text" id="login-id" name="username" autocomplete="username"
                   placeholder="사번 또는 아이디를 입력하세요" />
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="login-pw">비밀번호</label>
          <div class="field-box">
            <span class="i i-20 lead" style="--i:var(--ic-lock)" aria-hidden="true"></span>
            <input type="password" id="login-pw" name="password" autocomplete="current-password"
                   placeholder="비밀번호를 입력하세요" />
            <button type="button" class="pw-toggle" data-pw-toggle
                    aria-pressed="false" aria-controls="login-pw" aria-label="비밀번호 보기">
              <span class="i i-20" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <!-- Figma "Options" (663:6738) — 오른쪽은 아직 비어 있다 -->
        <div class="login-options">
          <label class="checkbox t-body-3">
            <input type="checkbox" name="remember" />
            <span class="box" aria-hidden="true"><span class="i"></span></span>
            <span>자동 로그인</span>
          </label>
        </div>

      </div>

      <!-- Figma "Button" — Secondary / Large -->
      <button type="submit" class="login-submit t-label-1">로그인</button>

      <!-- Figma "Help" -->
      <div class="login-help">
        <hr />
        <p class="t-caption">계정 발급 · 잠금 해제 문의 : 설비운영팀 내선 2400</p>
      </div>

      <!-- Figma "Copyright" — 카드 안 마지막 줄 -->
      <p class="login-copyright t-caption">ⓒ 2026 APRISM · 모든 접속 기록은 감사 로그에 저장됩니다.</p>

    </form>

  </div>

</div>

<script src="../assets/js/theme.js?v=dcf8f460"></script>
<script src="../assets/js/auth.js?v=8787fc36"></script>
</body>
</html>
