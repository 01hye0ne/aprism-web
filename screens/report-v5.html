<!DOCTYPE html>
<!-- v5 보고서(GNB [보고서]) — 10/29 디자이너 시안 "UI_전주기 보고서 탭"을 디자인 시스템으로 옮겼다(assets/css/report.css 맨 위에 바꾼 것). -->
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>v5 · 보고서 — APRISM</title>
  <meta name="description" content="보고서 — 날짜별 일일 보고서와 미션별 보고서, 월 보고서. 목차와 관제 양식 문서를 보고 PDF · DOCX 로 내려받는다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="../assets/css/tokens.css?v=b64812bd" />
  <link rel="stylesheet" href="../assets/css/app-shell.css?v=01264297" />
  <link rel="stylesheet" href="../assets/css/icons-outline.css?v=13527115" />
  <link rel="stylesheet" href="../assets/css/text-parts.css?v=e38e19ea" />
  <link rel="stylesheet" href="../assets/css/report.css?v=8d935bca" />
  <!-- v3 전용 규칙 — v2.2 는 10/21 부로 멈췄다. v3 에서 바꾸는 것은 여기(body.ver-3)에. -->
  <link rel="stylesheet" href="../assets/css/v3.css?v=7fce80d4" />
  <!-- v5 전용 규칙 — v4 는 10/29 부로 멈췄다. v5 에서 바꾸는 것은 여기(body.ver-5)에. -->
  <link rel="stylesheet" href="../assets/css/v5.css?v=09629c9e" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family-sans);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p { margin: 0; }
  </style>
</head>
<!-- .v2-2 — v2.2 와 같은 아웃라인 아이콘 세트(icons-outline.css). -->
<body class="v2-2 ver-3 ver-5">

<div class="app">

  <!-- ---------- Status Bar · 전체 폭 ---------- -->
  <!-- 상태바 — 알림 센터와 같다(미션 고르기 없음). 보고서는 미션 하나를 보는 화면이 아니다. -->
  <header class="status-bar">
    <a class="status-bar-logo" href="../index.html" aria-label="APRISM 홈">
      <span class="i" style="--i:var(--ic-brand-mark)" aria-hidden="true"></span>
    </a>

    <div class="status-bar-right">
      <div class="status-menu" data-status-menu>
        <button type="button" class="account-chip" data-menu-trigger
                aria-haspopup="true" aria-expanded="false">
          <span class="i i-16" style="--i:var(--ic-user)" aria-hidden="true"></span>
          <span class="t-label-2">홍길동</span>
          <span class="t-label-2 account-sep" aria-hidden="true">|</span>
          <span class="t-label-2">관제운영</span>
        </button>
        <div class="dropdown-menu account-menu" role="menu" aria-label="계정" hidden>
          <a class="menu-item" role="menuitem" href="#">
            <span class="i i-16" style="--i:var(--ic-user)" aria-hidden="true"></span>
            <span class="t-label-2">내 계정 정보</span>
          </a>
          <a class="menu-item" role="menuitem" href="#">
            <span class="i i-16" style="--i:var(--ic-lock)" aria-hidden="true"></span>
            <span class="t-label-2">비밀번호 변경</span>
          </a>
          <a class="menu-item" role="menuitem" href="#">
            <span class="i i-16" style="--i:var(--ic-power)" aria-hidden="true"></span>
            <span class="t-label-2">로그아웃</span>
          </a>
        </div>
      </div>

      <!-- 라이트 / 다크 — 홍길동(계정) 오른쪽(10/19). 지금과 반대 모드의 아이콘을 보인다(Figma Icon / lightMode 1267:21859 · darkMode 1267:21858, 10/19).
           누르면 바꾸고 브라우저에 기억한다(theme.js). -->
      <button type="button" class="theme-chip" data-theme-toggle aria-label="라이트 모드로 바꾸기">
        <span class="i i-16" aria-hidden="true"></span>
      </button>

      <div class="status-menu" data-status-menu>
        <button type="button" class="signal-chip" data-menu-trigger
                aria-haspopup="true" aria-expanded="false" aria-label="통신 상태">
          <span class="signal-bars"><i></i><i></i><i></i><i></i></span>
        </button>
        <div class="dropdown-menu signal-menu" role="menu" aria-label="통신 상태" hidden>
          <div class="menu-item" role="menuitem">
            <span class="t-label-2">AI Server</span>
            <span class="badge badge-normal t-caption"><span class="badge-dot"></span>Online</span>
          </div>
          <div class="menu-item" role="menuitem">
            <span class="t-label-2">DB server</span>
            <span class="badge badge-normal t-caption"><span class="badge-dot"></span>Online</span>
          </div>
          <div class="menu-item" role="menuitem">
            <span class="t-label-2">Network</span>
            <span class="signal-bars menu-signal"><i></i><i></i><i></i><i></i></span>
          </div>
        </div>
      </div>

      <span class="utc-clock">
        <span class="i i-16" style="--i:var(--ic-clock)" aria-hidden="true"></span>
        <span class="t-caption num">2026-10-13T10:11:24Z</span>
      </span>
    </div>
  </header>

  <div class="app-content">

    <!-- ---------- GNB Rail ---------- -->
    <nav class="gnb-rail" aria-label="전역 내비게이션">
      <div class="gnb-items">
        <a class="gnb-item" href="./main-v5.html">
          <span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-home)"></span></span><span>관제</span>
        </a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-shield)"></span></span><span>안전진단</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-bot)"></span></span><span>로봇</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-cpu)"></span></span><span>AI</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-calendar)"></span></span><span>스케줄러</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-delta)"></span></span><span>Delta</span></a>
        <a class="gnb-item" href="./report-v5.html" aria-current="page"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-document)"></span></span><span>보고서</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-users)"></span></span><span>계정관리</span></a>
      </div>
      <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-settings)"></span></span><span>환경설정</span></a>
    </nav>

    <!-- ---------- Body — 보고서 목록 | 보고서 ---------- -->
    <main class="rp-body" data-report>

      <!-- 왼쪽 — 보고서 목록(Figma UI_09 · 보고서 1432:40952). 미션과 하루 근무가 끝나면 자동으로 만들어지고, 월 보고서는 목록 맨 위 "월 보고서 자리"의 [만들기]로 만든다(10/29 — 따로 있던 전체 폭 단추를 목록 안으로).
           날짜 줄 = 그날의 일일 보고서(1:1 이라 합쳤다), 그 아래 └ 가지로 미션 보고서. 오늘처럼 근무가 안 끝난 날은 "작성 중"으로 못 누른다. -->
      <aside class="rp-side" data-rp-side aria-label="보고서 목록">
        <div class="rp-phead">
          <button type="button" class="rp-ptog" data-rp-fold aria-expanded="true" aria-label="보고서 목록 접기">
            <span class="i i-20" style="--i:var(--ic-panel-left)" aria-hidden="true"></span>
          </button>
          <p class="t-overline rp-plabel">보고서</p>
        </div>
        <div class="rp-sbody">
          <div class="rp-mrow">
            <div class="rp-mnav">
              <button type="button" class="rp-ib" data-rp-prev aria-label="이전 달"><span class="i i-16" style="--i:var(--ic-chevron-left)" aria-hidden="true"></span></button>
              <!-- 달 제목 = 달력 단추(10/29 디자이너) — 올리면 단추 면, 누르면 날짜로 찾기 달력 -->
              <button type="button" class="rp-mt t-title-2" data-rp-mt aria-haspopup="dialog" aria-expanded="false" aria-label="2026년 10월, 날짜로 찾기">2026년 10월</button>
              <button type="button" class="rp-ib" data-rp-next aria-label="다음 달"><span class="i i-16" style="--i:var(--ic-chevron-right)" aria-hidden="true"></span></button>
            </div>
            <p class="rp-cnt t-caption"><span>최신순 정렬</span><span class="rp-cn" data-rp-cnt></span></p>
          </div>
          <div class="rp-list" data-rp-list role="list"></div>
        </div>
      </aside>

      <!-- 오른쪽 — 보고서. 머리(종류 · 제목 · 날짜 · 유형 · 문서 번호 · 내려받기) 아래에 목차 | 관제 양식 문서 뷰어 · 쪽 표시(report.js 가 채운다). -->
      <section class="rp-detail" data-rp-detail aria-label="보고서">
        <div class="rp-dh" data-rp-dh></div>
      </section>

    </main>

  </div>
</div>

<script src="../assets/js/theme.js?v=c86093d9"></script>
<script src="../assets/js/report.js?v=299af1df"></script>
</body>
</html>
