  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family-sans);

    }

<!-- .v2-2 — v2.2 와 같은 아웃라인 아이콘 세트(icons-outline.css). -->
<body class="v2-2 ver-3 ver-5">

<div class="app">

  <header class="status-bar">
    <div class="status-bar-left">
      <a class="status-bar-logo" href="../index.html" aria-label="APRISM 홈">
        <span class="i" style="--i:var(--ic-brand-mark)" aria-hidden="true"></span>
      </a>
      <!-- [통합 순회 현황] › [미션 ▾] — 관제와 같은 경로. 안전진단은 미션마다 감지 6종을 보므로 보는 범위(전체 · 미션 하나)를 여기서 고른다(safety.js 가 그린다). -->
      <span class="status-bar-left" data-sf-crumb></span>
    </div>

    <div class="status-bar-right">
      <div class="status-menu" data-status-menu>
        <button type="button" class="account-chip" data-menu-trigger
                aria-haspopup="true" aria-expanded="false">
          <span class="i i-16" style="--i:var(--ic-user)" aria-hidden="true"></span>
          <span class="t-label-2">홍길동</span>
          <span class="t-label-2 account-sep" aria-hidden="true">|</span>
          <span class="t-label-2">관제운영</span>
        </button>
        <div class="dropdown-menu account-menu" role="menu" aria-label="계정" hidden>
          <a class="menu-item" role="menuitem" href="#">
            <span class="i i-16" style="--i:var(--ic-user)" aria-hidden="true"></span>
            <span class="t-label-2">내 계정 정보</span>
          </a>
          <a class="menu-item" role="menuitem" href="#">
            <span class="i i-16" style="--i:var(--ic-lock)" aria-hidden="true"></span>
            <span class="t-label-2">비밀번호 변경</span>
          </a>
          <a class="menu-item" role="menuitem" href="#">
            <span class="i i-16" style="--i:var(--ic-power)" aria-hidden="true"></span>
            <span class="t-label-2">로그아웃</span>
          </a>
        </div>
      </div>

      <!-- 라이트 / 다크 — 홍길동(계정) 오른쪽(10/19). 지금과 반대 모드의 아이콘을 보인다(Figma Icon / lightMode 1267:21859 · darkMode 1267:21858, 10/19).
           누르면 바꾸고 브라우저에 기억한다(theme.js). -->
      <button type="button" class="theme-chip" data-theme-toggle aria-label="라이트 모드로 바꾸기">
        <span class="i i-16" aria-hidden="true"></span>
      </button>

      <div class="status-menu" data-status-menu>
        <button type="button" class="signal-chip" data-menu-trigger
                aria-haspopup="true" aria-expanded="false" aria-label="통신 상태">
          <span class="signal-bars"><i></i><i></i><i></i><i></i></span>
        </button>
        <div class="dropdown-menu signal-menu" role="menu" aria-label="통신 상태" hidden>
          <div class="menu-item" role="menuitem">
            <span class="t-label-2">AI Server</span>
            <span class="badge badge-normal t-caption"><span class="badge-dot"></span>Online</span>
          </div>
          <div class="menu-item" role="menuitem">
            <span class="t-label-2">DB server</span>
            <span class="badge badge-normal t-caption"><span class="badge-dot"></span>Online</span>
          </div>
          <div class="menu-item" role="menuitem">
            <span class="t-label-2">Network</span>
            <span class="signal-bars menu-signal"><i></i><i></i><i></i><i></i></span>
          </div>
        </div>
      </div>

      <span class="utc-clock">
        <span class="i i-16" style="--i:var(--ic-clock)" aria-hidden="true"></span>
        <span class="t-caption num">2026-10-13T10:11:24Z</span>
      </span>
    </div>
  </header>

  <div class="app-content">

    <!-- ---------- GNB Rail ---------- -->
    <nav class="gnb-rail" aria-label="전역 내비게이션">
      <div class="gnb-items">
        <a class="gnb-item" href="./main-v5.html">
          <span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-home)"></span></span><span>관제</span>
        </a>
        <a class="gnb-item" href="./safety-v5.html" aria-current="page"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-shield)"></span></span><span>안전진단</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-bot)"></span></span><span>로봇</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-cpu)"></span></span><span>AI</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-calendar)"></span></span><span>스케줄러</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-delta)"></span></span><span>Delta</span></a>
        <a class="gnb-item" href="./report-v5.html"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-document)"></span></span><span>보고서</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-users)"></span></span><span>계정관리</span></a>
      </div>
      <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-settings)"></span></span><span>환경설정</span></a>
    </nav>

    <!-- ---------- Body — 안전진단 ---------- -->
    <!-- 왼쪽 340 패널(관제 · 보고서와 같은 짜임: 머리 [접기] 안전진단 + 본문) | 오른쪽 본문(라이브 · 요청 전 건수 · 카드/표 → 감지 6종 카드 또는 표).
         패널 본문은 미션 하나면 그 미션의 2D 지도(자세히 보기에서는 그 지점 · 연관 지점), 전체면 미션별 작은 지도 목록이다.
         미션 고르기는 상단바 경로 하나로(10/29 점검 — 세로 레일 · [6종 보기] 단추를 걷었다). safety.js 가 채운다. -->
    <main class="sf" data-sf aria-label="안전진단">
      <aside class="sf-side" aria-label="미션 지도">
        <div class="sf-phead">
          <button type="button" class="sf-ptog" data-sf-fold aria-expanded="true" aria-label="안전진단 패널 접기">
            <span class="i i-20" style="--i:var(--ic-panel-left)" aria-hidden="true"></span>
          </button>
          <p class="t-overline sf-plabel">안전진단</p>
        </div>
        <div class="sf-sbody" data-sf-sb></div>
      </aside>
      <section class="sf-main" aria-label="감지 결과">
        <div id="sfv"></div>
      </section>
    </main>

  </div>
</div>

<script src="../assets/js/theme.js?v=c86093d9"></script>
<script src="../assets/js/safety.js?v=dc769b52"></script>
</body>
</html>
