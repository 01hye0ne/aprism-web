<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>04.1 통합 관제 메인 — APRISM</title>
  <meta name="description" content="APRISM 공장 환경점검 로봇 관제 대시보드 메인 화면 퍼블리싱" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="../assets/css/tokens.css?v=8ae74359" />
  <link rel="stylesheet" href="../assets/css/app-shell.css?v=dbb6d2f9" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      background-color: var(--bg-canvas);
      color: var(--fg-primary);
      font-family: var(--font-family-sans);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p { margin: 0; }
  </style>
</head>
<body>

<!-- ============================================================
     Template / 04.1 Dashboard Home · 1922   (node 399:6225)
     ============================================================ -->
<div class="app">

  <!-- ---------- Status Bar · 전체 폭 ---------- -->
  <header class="status-bar">
    <span class="status-bar-logo">
      <span class="i" style="--i:var(--ic-brand-mark)" role="img" aria-label="APRISM"></span>
    </span>

    <div class="status-bar-right">
      <div class="status-bar-profile">
        <div class="account-chip">
          <span class="avatar"><span class="i i-14" style="--i:var(--ic-user)"></span></span>
          <span class="t-label-2">김현수 · 관제운영</span>
        </div>
        <span class="signal-bars" role="img" aria-label="통신 신호 강함"><i></i><i></i><i></i><i></i></span>
      </div>
      <span class="utc-clock">
        <span class="i i-16" style="--i:var(--ic-clock)"></span>
        <span class="t-caption num">2026-08-26T10:11:24Z</span>
      </span>
    </div>
  </header>

  <div class="app-content">

    <!-- ---------- GNB Rail ---------- -->
    <nav class="gnb-rail" aria-label="전역 내비게이션">
      <div class="gnb-items">
        <a class="gnb-item" href="#" aria-current="page">
          <span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-home)"></span></span><span>관제</span>
        </a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-shield)"></span></span><span>안전진단</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-bot)"></span></span><span>로봇</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-cpu)"></span></span><span>AI</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-calendar)"></span></span><span>스케줄러</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-message)"></span></span><span>Delta</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-document)"></span></span><span>보고서</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-users)"></span></span><span>계정관리</span></a>
      </div>
      <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-settings)"></span></span><span>환경설정</span></a>
    </nav>

    <!-- ---------- Container · bg/surface/default 면 ---------- -->
    <div class="content-surface">

      <!-- ---------- Site Context Panel ---------- -->
      <aside class="context-panel" id="site-panel" aria-label="사이트 컨텍스트">

        <div class="panel-head">
          <p class="t-overline section-label">SITE</p>
          <button type="button" data-panel-toggle
                  aria-expanded="true" aria-controls="site-panel" aria-label="사이트 패널 접기">
            <span class="i i-20" style="--i:var(--ic-panel-left)"></span>
          </button>
        </div>

        <!-- 사이트 이름과 터빈 선택. bg/accent 면 위에 놓인다. -->
        <div class="site-block">
          <h1 class="t-heading-3">지하발전소 B3</h1>
          <div class="select-field t-body-3" role="button" tabindex="0">
            <span>터빈 2 / Unit 03</span>
            <span class="i i-16" style="--i:var(--ic-chevron-down)"></span>
          </div>
        </div>

        <div class="panel-body">
          <section class="panel-section">
            <p class="t-overline section-label">운영 모드</p>
            <span class="badge badge-mode t-label-2"><span class="badge-dot"></span>진행 중</span>
          </section>
        </div>

      </aside>

      <!-- ---------- Main ---------- -->
      <main class="main">
        <div class="two-col">

          <!-- ---------- Map Panel ---------- -->
          <section class="map-panel" aria-label="설비 배치도">
            <div class="map-canvas">
              <span class="badge badge-info badge-marker t-label-2 map-marker">
                <span class="badge-dot"></span>Robot 02
              </span>

              <div class="map-tools">
                <button type="button" class="icon-button" aria-label="확대">
                  <span class="i i-20" style="--i:var(--ic-zoom-in)"></span>
                </button>
                <button type="button" class="icon-button" aria-label="로봇 추적">
                  <span class="i i-20" style="--i:var(--ic-target)"></span>
                </button>
                <button type="button" class="icon-button is-active" aria-label="영상 리플레이">
                  <span class="i i-20" style="--i:var(--ic-play)"></span>
                </button>
              </div>
            </div>

            <!-- AI Assist Panel · Emphasis=closed 기본, 우측 토글로 opened -->
            <section class="ai-panel" data-ai-panel aria-label="Delta AI 요약">

              <!-- Figma 의 Spectrum. 2px 선 300개를 반복 배경 하나로 대신한다. -->
              <span class="ai-spectrum" aria-hidden="true"></span>

              <button type="button" class="ai-toggle" data-ai-toggle
                      aria-expanded="false" aria-controls="ai-summary" aria-label="요약 펼치기">
                <span class="i i-20" style="--i:var(--ic-chevron-down)"></span>
              </button>

              <div class="ai-fold ai-fold-closed">
                <div><div class="ai-closed">
                  <span class="ai-thumb" aria-hidden="true"></span>
                  <p class="ai-closed-text">터빈2에 주의 1건.</p>
                </div></div>
              </div>

              <div class="ai-fold ai-fold-open" id="ai-summary">
                <div><div class="ai-opened">
                  <div class="ai-summary">
                    <div class="ai-message">
                      <p class="t-caption ai-eyebrow">DELTA</p>
                      <p class="t-heading-1 ai-line-1">터빈2에 주의 1건.</p>
                      <p class="t-heading-1 ai-line-2">무엇을 확인해 드릴까요?</p>
                    </div>

                    <div class="ai-suggestions">
                      <button type="button" class="ai-chip t-label-2">Spiral Casing 압력 추이 보여줘</button>
                      <button type="button" class="ai-chip t-label-2">이 설비 최근 결함 3건</button>
                      <button type="button" class="ai-chip t-label-2">재진단 예약해줘</button>
                    </div>
                  </div>

                  <div class="ai-input">
                    <span class="t-body-2">무엇이든 물어보세요</span>
                    <button type="button" class="ai-send" aria-label="보내기">
                      <span class="i i-16" style="--i:var(--ic-arrow-right)"></span>
                    </button>
                  </div>
                </div></div>
              </div>

            </section>
          </section>

          <!-- ---------- Robot / Mission Panel ---------- -->
          <div class="floating">
            <section class="right-panel" aria-label="로봇 · 미션">

              <!-- 카드 1 · 로봇 -->
              <div class="panel-card">
                <div class="panel-header">
                  <div class="texts">
                    <h2 class="t-heading-3">전체 미션명</h2>
                    <p class="t-caption">3대 연결 · 1대 수행 중</p>
                  </div>
                  <div class="buttons">
                    <button type="button" class="btn btn-primary">미션 관리</button>
                    <button type="button" class="btn btn-danger">비상정지</button>
                  </div>
                </div>

                <div class="robot-strip" role="group" aria-label="로봇 선택">
                  <button type="button" class="robot-card" data-robot="0" aria-pressed="true">
                    <span class="label">
                      <span class="t-label-1 robot-id">로봇명</span>
                      <span class="robot-thumb" aria-hidden="true"></span>
                    </span>
                    <span class="robot-lists">
                      <span class="robot-row">
                        <span class="t-caption">Mission</span>
                        <span class="badge badge-info t-label-2"><span class="badge-dot"></span>수행중</span>
                      </span>
                      <span class="robot-row">
                        <span class="t-caption">Battery</span>
                        <span class="battery">
                          <span class="battery-body"><span class="battery-fill" style="width:78%"></span></span>
                          <span class="battery-tip"></span>
                          <span class="t-caption num">78%</span>
                        </span>
                      </span>
                      <span class="robot-row">
                        <span class="t-caption">Signal</span>
                        <span class="battery">
                          <span class="signal-bars" data-level="4"><i></i><i></i><i></i><i></i></span>
                          <span class="t-caption">Strong</span>
                        </span>
                      </span>
                    </span>
                  </button>

                  <button type="button" class="robot-card" data-robot="1" aria-pressed="false">
                    <span class="label">
                      <span class="t-label-1 robot-id">로봇명</span>
                      <span class="robot-thumb" aria-hidden="true"></span>
                    </span>
                    <span class="robot-lists">
                      <span class="robot-row">
                        <span class="t-caption">Mission</span>
                        <span class="badge badge-idle t-label-2"><span class="badge-dot"></span>대기</span>
                      </span>
                      <span class="robot-row">
                        <span class="t-caption">Battery</span>
                        <span class="battery is-critical">
                          <span class="battery-body"><span class="battery-fill" style="width:18%"></span></span>
                          <span class="battery-tip"></span>
                          <span class="t-caption num">18%</span>
                        </span>
                      </span>
                      <span class="robot-row">
                        <span class="t-caption">Signal</span>
                        <span class="battery is-warning">
                          <span class="signal-bars" data-level="2"><i></i><i></i><i></i><i></i></span>
                          <span class="t-caption">Weak</span>
                        </span>
                      </span>
                    </span>
                  </button>

                  <button type="button" class="robot-card" data-robot="2" aria-pressed="false">
                    <span class="label">
                      <span class="t-label-1 robot-id">로봇명</span>
                      <span class="robot-thumb" aria-hidden="true"></span>
                    </span>
                    <span class="robot-lists">
                      <span class="robot-row">
                        <span class="t-caption">Mission</span>
                        <span class="badge badge-idle t-label-2"><span class="badge-dot"></span>대기</span>
                      </span>
                      <span class="robot-row">
                        <span class="t-caption">Battery</span>
                        <span class="battery is-warning">
                          <span class="battery-body"><span class="battery-fill" style="width:35%"></span></span>
                          <span class="battery-tip"></span>
                          <span class="t-caption num">35%</span>
                        </span>
                      </span>
                      <span class="robot-row">
                        <span class="t-caption">Signal</span>
                        <span class="battery">
                          <span class="signal-bars" data-level="3"><i></i><i></i><i></i><i></i></span>
                          <span class="t-caption">Good</span>
                        </span>
                      </span>
                    </span>
                  </button>
                </div>
              </div>

              <!-- 카드 2 · 미션 -->
              <div class="panel-card is-fill">
                <div class="mission-header">
                  <p class="t-overline section-label">전체 미션명</p>

                  <div class="progress-bar">
                    <div class="progress-meta">
                      <span class="progress-title t-title-1">
                        <span class="badge-dot"></span><span data-progress-title>현재 수행명</span>
                      </span>
                      <span class="progress-values t-caption">
                        <span class="num" data-progress-count></span><span class="num" data-progress-percent></span>
                      </span>
                    </div>
                    <div class="progress-track" role="img" data-progress-track></div>
                  </div>
                </div>

                <!-- 선택된 로봇의 waypoint 다. screen.js 가 그린다. -->
                <div class="timeline" data-timeline aria-live="polite">
                </div>
              </div>

            </section>
          </div>

        </div>
      </main>

    </div>

  </div>
</div>


<script src="../assets/js/theme.js?v=dcf8f460"></script>
<script src="../assets/js/screen.js?v=088e66e9"></script>
</body>
</html>
