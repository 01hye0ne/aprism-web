<!DOCTYPE html>
<!-- v5 — v4(*-v3.html)를 10/29 에 복제해 시작했다. 이후 작업은 v5 에서만. Delta 는 위젯형만 쓴다. -->
<!-- v3 — alert-center.html 을 10/21 에 복제해 시작했다. 이후 작업은 v3 에서만. -->
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>v5 · 알림 센터 — APRISM</title>
  <meta name="description" content="SD-08 알림 센터 — 끝난 미션의 알림이 모인다. v2.2 통합 관제 메인의 [전체보기] 가 여는 화면이다." />
  <!-- 알림 센터(SD-08) — Figma 1177:15915 "SD-08 알림 센터 · B안 · 미확인 선택 상세".
       v2.2 통합 관제 메인의 [전체보기] 가 이 화면을 연다. 듀얼 모니터면 다른 모니터에 뜬다(monitor.js).

       Figma 에서 위계가 안 맞던 자리를 고쳤다 — 무엇을 왜 고쳤는지는
       assets/css/alert-center.css 맨 위 주석에 열세 가지로 적어 뒀다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="../assets/css/tokens.css?v=b64812bd" />
  <link rel="stylesheet" href="../assets/css/app-shell.css?v=01264297" />
  <link rel="stylesheet" href="../assets/css/icons-outline.css?v=13527115" />
  <link rel="stylesheet" href="../assets/css/text-parts.css?v=e38e19ea" />
  <link rel="stylesheet" href="../assets/css/alert-center.css?v=aabe6bda" />
  <!-- v3 전용 규칙 — v2.2 는 10/21 부로 멈췄다. v3 에서 바꾸는 것은 여기(body.ver-3)에. -->
  <link rel="stylesheet" href="../assets/css/v3.css?v=7fce80d4" />
  <!-- v5 전용 규칙 — v4 는 10/29 부로 멈췄다. v5 에서 바꾸는 것은 여기(body.ver-5)에. -->
  <link rel="stylesheet" href="../assets/css/v5.css?v=7f594aa8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family-sans);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p { margin: 0; }
  </style>
</head>
<!-- .v2-2 — v2.2 와 같은 아웃라인 아이콘 세트를 쓴다(icons-outline.css).
     .ac-page — 이 화면에만 있는 Icon / download 를 받는다(alert-center.css 맨 아래). -->
<body class="v2-2 ac-page ver-3 ver-5">

<div class="app">

  <!-- ---------- Status Bar · 전체 폭 ---------- -->
  <!--
    v2.2 와 같은 상태바인데 미션 고르기(scope-menu)는 두지 않았다 —
    알림 센터는 미션 하나를 보는 화면이 아니고, 아래 필터 바에 [미션] 이 따로 있다.
    고르는 자리가 두 군데면 어느 쪽이 기준인지 알 수 없다.
    층 이름도 뺐다 — 여러 층 · 여러 미션의 알림이 함께 모이는 화면이다.
  -->
  <header class="status-bar">
    <a class="status-bar-logo" href="../index.html" aria-label="APRISM 홈">
      <span class="i" style="--i:var(--ic-brand-mark)" aria-hidden="true"></span>
    </a>

    <div class="status-bar-right">
      <div class="status-menu" data-status-menu>
        <button type="button" class="account-chip" data-menu-trigger
                aria-haspopup="true" aria-expanded="false">
          <span class="i i-16" style="--i:var(--ic-user)" aria-hidden="true"></span>
          <span class="t-label-2">홍길동</span>
          <span class="t-label-2 account-sep" aria-hidden="true">|</span>
          <span class="t-label-2">관제운영</span>
        </button>
        <div class="dropdown-menu account-menu" role="menu" aria-label="계정" hidden>
          <a class="menu-item" role="menuitem" href="#">
            <span class="i i-16" style="--i:var(--ic-user)" aria-hidden="true"></span>
            <span class="t-label-2">내 계정 정보</span>
          </a>
          <a class="menu-item" role="menuitem" href="#">
            <span class="i i-16" style="--i:var(--ic-lock)" aria-hidden="true"></span>
            <span class="t-label-2">비밀번호 변경</span>
          </a>
          <a class="menu-item" role="menuitem" href="#">
            <span class="i i-16" style="--i:var(--ic-power)" aria-hidden="true"></span>
            <span class="t-label-2">로그아웃</span>
          </a>
        </div>
      </div>

      <!-- 라이트 / 다크 — 홍길동(계정) 오른쪽(10/19). 지금과 반대 모드의 아이콘을 보인다(Figma Icon / lightMode 1267:21859 · darkMode 1267:21858, 10/19).
           누르면 바꾸고 브라우저에 기억한다(theme.js). -->
      <button type="button" class="theme-chip" data-theme-toggle aria-label="라이트 모드로 바꾸기">
        <span class="i i-16" aria-hidden="true"></span>
      </button>

      <div class="status-menu" data-status-menu>
        <button type="button" class="signal-chip" data-menu-trigger
                aria-haspopup="true" aria-expanded="false" aria-label="통신 상태">
          <span class="signal-bars"><i></i><i></i><i></i><i></i></span>
        </button>
        <div class="dropdown-menu signal-menu" role="menu" aria-label="통신 상태" hidden>
          <div class="menu-item" role="menuitem">
            <span class="t-label-2">AI Server</span>
            <span class="badge badge-normal t-caption"><span class="badge-dot"></span>Online</span>
          </div>
          <div class="menu-item" role="menuitem">
            <span class="t-label-2">DB server</span>
            <span class="badge badge-normal t-caption"><span class="badge-dot"></span>Online</span>
          </div>
          <div class="menu-item" role="menuitem">
            <span class="t-label-2">Network</span>
            <span class="signal-bars menu-signal"><i></i><i></i><i></i><i></i></span>
          </div>
        </div>
      </div>

      <span class="utc-clock">
        <span class="i i-16" style="--i:var(--ic-clock)" aria-hidden="true"></span>
        <span class="t-caption num">2026-10-13T10:11:24Z</span>
      </span>
    </div>
  </header>

  <div class="app-content">

    <!-- ---------- GNB Rail ---------- -->
    <!-- 알림 센터는 관제 아래에 있는 자리다 — [관제] 가 켜져 있다. -->
    <nav class="gnb-rail" aria-label="전역 내비게이션">
      <div class="gnb-items">
        <a class="gnb-item" href="./main-v5.html" aria-current="page">
          <span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-home)"></span></span><span>관제</span>
        </a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-shield)"></span></span><span>안전진단</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-bot)"></span></span><span>로봇</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-cpu)"></span></span><span>AI</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-calendar)"></span></span><span>스케줄러</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-delta)"></span></span><span>Delta</span></a>
        <a class="gnb-item" href="./report-v5.html"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-document)"></span></span><span>보고서</span></a>
        <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-users)"></span></span><span>계정관리</span></a>
      </div>
      <a class="gnb-item" href="#"><span class="gnb-icon"><span class="i i-20" style="--i:var(--ic-settings)"></span></span><span>환경설정</span></a>
    </nav>

    <!-- ---------- Body ---------- -->
    <main class="ac-body">

      <!-- Breadcrumb — Figma 는 "알림 이력" 이었다. 제목(h1)이 "알림 센터" 라
           한 화면에 이름이 둘이 된다. 제목 쪽으로 맞췄다. -->
      <nav class="ac-crumb t-body-4" aria-label="현재 위치">
        <a href="./main-v5.html">메인</a>
        <span class="i i-14" style="--i:var(--ic-chevron-right)" aria-hidden="true"></span>
        <span class="t-label-2" aria-current="page">알림 센터</span>
      </nav>

      <!-- 제목 줄 -->
      <div class="ac-title-row">
        <div class="ac-title-left">
          <h1 class="t-heading-2">알림 센터</h1>
          <span class="ac-count-badge t-label-2">
            <span class="badge-dot" aria-hidden="true"></span>
            <span data-ac-open-badge>미확인 11건</span>
          </span>
        </div>
        <div class="ac-title-controls">
          <!-- Figma 는 Size=Medium(36) 이다. 아래 [조치 완료] 도 36 으로 맞췄다 —
               Figma 에서는 주 동작이 32 로 보조보다 작았다. -->
          <button type="button" class="btn btn-secondary is-md">
            <span class="i i-20" style="--i:var(--ic-download)" aria-hidden="true"></span>
            보고서 내보내기
          </button>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="ac-filter">
        <span class="ac-filter-label t-caption">미션</span>
        <div class="field-select ac-f-mission" data-select>
          <button type="button" class="field-box is-select" data-select-trigger
                  aria-haspopup="listbox" aria-expanded="false" aria-label="미션">
            <span data-select-value>전체 미션</span>
            <span class="i i-20" style="--i:var(--ic-chevron-down)" aria-hidden="true"></span>
          </button>
          <ul class="field-menu" role="listbox" aria-label="미션" hidden>
            <li class="field-option" role="option" aria-selected="true">전체 미션</li>
            <li class="field-option" role="option">터빈 정기점검</li>
            <li class="field-option" role="option">전기실 순회</li>
            <li class="field-option" role="option">설비 순회</li>
            <li class="field-option" role="option">옥외 저장탱크 순찰</li>
          </ul>
        </div>

        <span class="ac-filter-divider" aria-hidden="true"></span>

        <span class="ac-filter-label t-caption">등급</span>
        <!-- Figma 는 전체 · 위험 · 주의 세 개가 모두 체크돼 있었다.
             전체는 나머지의 부모라 함께 켜질 수 없다 — 전체만 켠 상태로 시작한다. -->
        <button type="button" class="ac-check" role="checkbox" aria-checked="true" data-ac-sev="all">
          <span class="check-box" aria-hidden="true">
            <span class="i" style="--i:var(--ic-check)"></span>
          </span>
          <span data-ac-f-all>전체 22</span>
        </button>
        <button type="button" class="ac-check" role="checkbox" aria-checked="false" data-ac-sev="critical">
          <span class="check-box" aria-hidden="true">
            <span class="i" style="--i:var(--ic-check)"></span>
          </span>
          <span data-ac-f-crit>위험 8</span>
        </button>
        <button type="button" class="ac-check" role="checkbox" aria-checked="false" data-ac-sev="warning">
          <span class="check-box" aria-hidden="true">
            <span class="i" style="--i:var(--ic-check)"></span>
          </span>
          <span data-ac-f-warn>주의 14</span>
        </button>

        <span class="ac-filter-divider" aria-hidden="true"></span>

        <span class="ac-filter-label t-caption">기간</span>
        <div class="field-select ac-f-period" data-select>
          <button type="button" class="field-box is-select" data-select-trigger
                  aria-haspopup="listbox" aria-expanded="false" aria-label="기간">
            <span data-select-value>전체 기간</span>
            <span class="i i-20" style="--i:var(--ic-chevron-down)" aria-hidden="true"></span>
          </button>
          <ul class="field-menu" role="listbox" aria-label="기간" hidden>
            <li class="field-option" role="option" aria-selected="true">전체 기간</li>
            <li class="field-option" role="option">오늘</li>
          </ul>
        </div>

        <span class="ac-filter-label t-caption">정렬</span>
        <div class="field-select ac-f-sort" data-select>
          <button type="button" class="field-box is-select" data-select-trigger
                  aria-haspopup="listbox" aria-expanded="false" aria-label="정렬">
            <span data-select-value>위험 우선</span>
            <span class="i i-20" style="--i:var(--ic-chevron-down)" aria-hidden="true"></span>
          </button>
          <ul class="field-menu" role="listbox" aria-label="정렬" hidden>
            <li class="field-option" role="option" aria-selected="true">위험 우선</li>
            <li class="field-option" role="option">최신순</li>
            <li class="field-option" role="option">오래된순</li>
          </ul>
        </div>

        <span class="ac-filter-spacer"></span>
      </div>

      <!-- Board — 왼쪽 목록 / 오른쪽 선택 상세 -->
      <div class="ac-board">

        <!-- ===== 미확인 · 조치 완료 ===== -->
        <section class="ac-open" aria-label="알림 목록">
          <div class="ac-panel-head">
            <div class="ac-tabs" role="tablist" aria-label="알림 상태">
              <button type="button" class="ac-tab" role="tab" aria-selected="true" data-ac-tab="open">
                <span class="t-label-1">미확인</span>
                <span class="ac-tab-count ac-mono" data-ac-count-open>11건</span>
              </button>
              <button type="button" class="ac-tab" role="tab" aria-selected="false" data-ac-tab="done">
                <span class="t-label-1">조치 완료</span>
                <span class="ac-tab-count ac-mono" data-ac-count-done>11건</span>
              </button>
            </div>
            <span class="ac-head-spacer"></span>
            <!-- 탭 옆 배지는 그 탭의 단계별 건수다 — 탭을 바꾸면 같이 바뀐다.
                 표식은 점이 아니라 단계 기호(위험 ⓧ · 주의 △, 10/20 디자이너) — 점은 상태에만 쓴다. -->
            <div class="ac-head-badges">
              <span class="badge badge-danger t-caption">
                <span class="i ac-count-ic" style="--i:var(--ic-error)" aria-hidden="true"></span><span data-ac-badge-crit>위험 3</span>
              </span>
              <span class="badge badge-warning t-caption">
                <span class="i ac-count-ic" style="--i:var(--ic-warning)" aria-hidden="true"></span><span data-ac-badge-warn>주의 8</span>
              </span>
            </div>
            <!-- Figma 1202:16190 — 끝난 조치를 묶어 인수인계 초안을 만든다. 조치 완료 탭에만 선다. -->
            <button type="button" class="btn btn-secondary is-xs ac-summary-btn" data-ac-summary hidden>
              <span class="i i-16" style="--i:var(--ic-cpu)" aria-hidden="true"></span>
              오늘 조치 요약 만들기
            </button>
          </div>

          <!--
            줄마다 [안전진단](예전 [보고서]) 버튼이 들어가므로 줄을 button 으로 둘 수 없다(button 중첩).
            grid 짜임으로 두고 줄에 tabindex 를 준다 — 위/아래 화살표로 옮기고 Enter 로 고른다.
          -->
          <!-- DELTA 인수인계 요약(Figma 1202:16191 Handover Slot) — 조치 완료 탭 목록 위에 선다. -->
          <div class="ac-handover-slot" data-ac-handover hidden></div>

          <div class="ac-list-wrap" role="grid" aria-label="알림 목록">
            <!-- 열이 탭마다 다르다(미확인은 발생 · 위치 · 미션, 조치 완료는 조치 · 원 등급 · 담당).
                 alert-center.js 의 renderColHead() 가 채운다. -->
            <div role="rowgroup">
              <div class="ac-col-head t-caption" role="row" data-ac-colhead></div>
            </div>
            <div class="ac-list" role="rowgroup" data-ac-list></div>
          </div>
        </section>

        <!-- ===== 선택 상세 ===== -->
        <section class="ac-detail" aria-label="선택한 알림">
          <!-- Figma 는 "1/4" 숫자만 있었다 — 앞뒤로 갈 길이 없는 숫자다. 이전·다음을 붙였다. -->
          <div class="ac-detail-head">
            <span class="ac-head-spacer"></span>
            <button type="button" class="ac-nav" data-ac-prev aria-label="이전 알림">
              <span class="i i-16" style="--i:var(--ic-chevron-left)" aria-hidden="true"></span>
            </button>
            <span class="ac-nth ac-mono" data-ac-nth>1 / 11</span>
            <button type="button" class="ac-nav" data-ac-next aria-label="다음 알림">
              <span class="i i-16" style="--i:var(--ic-chevron-right)" aria-hidden="true"></span>
            </button>
          </div>
          <div class="ac-detail-body" data-ac-detail></div>
        </section>

      </div>
    </main>

  </div>
</div>

<script src="../assets/js/theme.js?v=c86093d9"></script>
<script src="../assets/js/alert-center.js?v=1e33b6b7"></script>
</body>
</html>
