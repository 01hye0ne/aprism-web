<style>
  body { margin:0; background:#0a0c11; }
  /* 72% stance: foot planted, dragged straight back at constant speed.
     28% swing: that one leg lifts and steps forward — windows never overlap. */
  @keyframes rd-hip {
    0%   { transform: rotate(var(--amp)); animation-timing-function: linear; }
    76%  { transform: rotate(calc(var(--amp) * -1)); animation-timing-function: cubic-bezier(.45,.02,.3,1); }
    100% { transform: rotate(var(--amp)); }
  }
  @keyframes rd-knee {
    0%   { transform: rotate(0deg); }
    76%  { transform: rotate(0deg); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    88%  { transform: rotate(var(--knee)); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    100% { transform: rotate(0deg); }
  }
  @keyframes rd-bob {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(calc(var(--bob) * -1)); }
    100% { transform: translateY(0px); }
  }
  @keyframes rd-glow {
    0%   { opacity: .75; transform: scaleX(1); }
    50%  { opacity: 1;   transform: scaleX(1.06); }
    100% { opacity: .75; transform: scaleX(1); }
  }
  @keyframes rd-ground {
    from { background-position: 0 0; }
    to   { background-position: 240px 0; }
  }
  @keyframes rd-shadow {
    0%   { transform: scaleX(1);    opacity: .5; }
    50%  { transform: scaleX(.88);  opacity: .38; }
    100% { transform: scaleX(1);    opacity: .5; }
  }
</style>
</helmet>

  </div>

  <div style="display:flex;gap:28px;flex-wrap:wrap;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5c6577">
    <div>gait · {{ gaitLabel }}</div>
    <div>cycle · {{ cycleLabel }}</div>
    <div>hip {{ ampLabel }} / knee {{ kneeLabel }}</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;gait&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;walk&quot;,&quot;trot&quot;,&quot;pace&quot;],&quot;default&quot;:&quot;walk&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.3,&quot;max&quot;:2.5,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;stagger&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:12,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;hipSwing&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:5,&quot;max&quot;:30,&quot;step&quot;:1,&quot;unit&quot;:&quot;deg&quot;,&quot;default&quot;:17,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;kneeBend&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:50,&quot;step&quot;:1,&quot;unit&quot;:&quot;deg&quot;,&quot;default&quot;:26,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;bodyBob&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.2,&quot;unit&quot;:&quot;px&quot;,&quot;default&quot;:1.6,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:160,&quot;max&quot;:520,&quot;default&quot;:330,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;}}">
class Component extends DCLogic {
  apply() {
    const s = this.svg;
    if (!s) return;
    const p = this.props;
    const dur = 1.6 / (p.speed ?? 1);
    const gait = p.gait ?? "walk";
    // phase offsets as fractions of the cycle
    // front pair always opposed, back pair always opposed (contralateral, like human arms/legs)
    const ph = gait === "walk"
      ? { nearFront: 0, farRear: 0.25, farFront: 0.5, nearRear: 0.75 }
      : gait === "pace"
      ? { nearFront: 0, farRear: 0.5, nearRear: 0, farFront: 0.5 }
      : { nearFront: 0, farRear: 0, nearRear: 0.5, farFront: 0.5 };
    s.style.setProperty("--dur", dur + "s");
    s.style.setProperty("--amp", (p.hipSwing ?? 17) + "deg");
    s.style.setProperty("--knee", (p.kneeBend ?? 26) + "deg");
    s.style.setProperty("--bob", (p.bodyBob ?? 1.6) + "px");
    // small stagger so the four legs never land on exactly the same beat
    s.style.setProperty("--bobdur", (dur / 4) + "s");
    const st = (p.stagger ?? 0) / 100;
    const off = { nearFront: 0, farFront: st, nearRear: st * 1.7, farRear: st * 0.7 };
    const delay = (k) => -dur * (((ph[k] + off[k]) % 1) + 1) % dur;
    s.style.setProperty("--p-near-front", delay("nearFront") + "s");
    s.style.setProperty("--p-far-front", delay("farFront") + "s");
    s.style.setProperty("--p-near-rear", delay("nearRear") + "s");
    s.style.setProperty("--p-far-rear", delay("farRear") + "s");
    s.style.width = (p.size ?? 330) + "px";
    s.style.height = ((p.size ?? 330) * 90 / 95) + "px";
    if (this.stage) this.stage.style.setProperty("--dur", dur + "s");
  }
  componentDidMount() { this.apply(); }
  componentDidUpdate() { this.apply(); }
  renderVals() {
    const p = this.props;
    const gait = p.gait ?? "walk";
    return {
      svg: (el) => { this.svg = el; this.apply(); },
      stage: (el) => { this.stage = el; this.apply(); },
      gaitLabel: gait,
      cycleLabel: (1.6 / (p.speed ?? 1)).toFixed(2) + "s",
      ampLabel: (p.hipSwing ?? 17) + "°",
      kneeLabel: (p.kneeBend ?? 26) + "°"
    };
  }
}
</script>
